<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion Strava · RunCrew</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 20%, #151f38 0%, #080d1a 100%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: rgba(18, 26, 47, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 36px 28px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .badge-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 24px;
    }
    .logo-badge {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: #111a2e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 22px;
      color: #00E5FF;
      border: 1px solid rgba(0, 229, 255, 0.3);
    }
    .strava-badge {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: #FC4C02;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 900;
      font-size: 24px;
      box-shadow: 0 8px 20px rgba(252, 76, 2, 0.35);
    }
    .arrow {
      color: rgba(255, 255, 255, 0.3);
      font-size: 20px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }
    p {
      color: rgba(255, 255, 255, 0.65);
      font-size: 14.5px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(0, 229, 255, 0.15);
      border-top-color: #00E5FF;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 0 auto 20px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn {
      display: inline-block;
      width: 100%;
      background: linear-gradient(135deg, #FC4C02 0%, #E34000 100%);
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      padding: 14px 20px;
      border-radius: 14px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 10px 24px rgba(252, 76, 2, 0.35);
      cursor: pointer;
      border: none;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .error-box {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #FCA5A5;
      padding: 12px;
      border-radius: 12px;
      font-size: 13.5px;
      margin-bottom: 20px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge-row">
      <div class="strava-badge">S</div>
      <div class="arrow">➔</div>
      <div class="logo-badge">RC</div>
    </div>
    
    <div id="loading-state">
      <div class="spinner"></div>
      <h1>Connexion Strava en cours</h1>
      <p>Redirection automatique vers l'application RunCrew...</p>
      <a id="open-app-btn" href="#" class="btn">Ouvrir l'application RunCrew</a>
    </div>

    <div id="error-box" class="error-box"></div>
  </div>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const error = params.get('error');
      const scope = params.get('scope');

      const errorBox = document.getElementById('error-box');
      const loadingState = document.getElementById('loading-state');
      const openAppBtn = document.getElementById('open-app-btn');

      if (error) {
        loadingState.style.display = 'none';
        errorBox.style.display = 'block';
        errorBox.innerHTML = '<strong>Autorisation refusée :</strong> ' + (error || 'Opération annulée');
        return;
      }

      if (!code) {
        loadingState.style.display = 'none';
        errorBox.style.display = 'block';
        errorBox.innerHTML = '<strong>Erreur :</strong> Aucun code d\'autorisation reçu de Strava.';
        return;
      }

      let appUri = 'runcrew://oauth/strava?code=' + encodeURIComponent(code);
      if (scope) {
        appUri += '&scope=' + encodeURIComponent(scope);
      }

      openAppBtn.setAttribute('href', appUri);

      // Redirection automatique immédiate
      window.location.href = appUri;

      // Repli après 1.5s
      setTimeout(function() {
        openAppBtn.textContent = 'Appuyez pour revenir dans RunCrew';
      }, 1500);
    })();
  </script>
</body>
</html>
